<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-built-at="{{BUILT_AT}}">
  <header class="app-toolbar">
    <div class="app-identity">
      <span class="app-mark" aria-hidden="true"></span>
      <h1 class="app-name">START</h1>
    </div>
    {{SEARCH_WIDGET}}
  </header>
  <main class="workspace">
    <section class="rss-workspace" aria-labelledby="rss-heading">
      <div class="workspace-header">
        <h2 id="rss-heading">RSS</h2>
        <span class="workspace-note">HEADLINES</span>
      </div>
      <div class="rss-content">
        <div class="widget-grid">
          {{WIDGET_GRID}}
        </div>
      </div>
    </section>
    <section class="future-workspace" aria-labelledby="future-heading">
      <div class="workspace-header">
        <h2 id="future-heading">WORKSPACE</h2>
        <span class="workspace-note">FUTURE</span>
      </div>
      <div class="future-content">
        <span class="future-label">RESERVED FOR FUTURE WIDGETS</span>
      </div>
    </section>
    <p class="viewport-warning">Increase the window size to view the dashboard.</p>
  </main>
  <footer class="status-bar">
    <span class="status-label">START</span>
    <span class="built-at">BUILT <time id="built-at-time" datetime="{{BUILT_AT}}">{{BUILT_AT}}</time></span>
  </footer>
  <script>
    (function () {
      var el = document.getElementById('built-at-time');
      if (!el) return;
      var d = new Date(el.getAttribute('datetime'));
      if (isNaN(d.getTime())) return;
      var diff = Math.floor((Date.now() - d) / 60000);
      if (diff < 1) el.textContent = 'just now';
      else if (diff < 60) el.textContent = diff + 'm ago';
      else el.textContent = Math.floor(diff / 60) + 'h ago';
    })();
  </script>
</body>
</html>
